services:
  api:
    build:
      context: .
    image: devops-task-api:local
    container_name: devops-task-api
    ports:
      - "${APP_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cicd-network

networks:
  cicd-network:
    name: cicd-network
    external: true
